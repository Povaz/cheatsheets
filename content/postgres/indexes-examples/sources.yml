sources:
  - title: "Suzuki — The Internals of PostgreSQL, ch. 1 §1.4 Writing and Reading Tuples"
    url: https://www.interdb.jp/pg/pgsql01/04.html
    type: doc
    fetched: 2026-08-22
    read_as: "grounds §descent — index tuple = key + TID, heap fetch through the line pointer"

  - title: "PostgreSQL source — src/backend/access/nbtree/README"
    url: https://github.com/postgres/postgres/blob/master/src/backend/access/nbtree/README
    type: doc
    fetched: 2026-08-22
    read_as: "grounds §split-race and §afterlife — split mechanics, high key + right-link recovery, short per-page locks, LP_DEAD protocol"

  - title: "PostgreSQL docs — Transaction Isolation"
    url: https://www.postgresql.org/docs/current/transaction-iso.html
    type: doc
    fetched: 2026-08-23
    read_as: "grounds §snapshots — REPEATABLE READ keeps its first snapshot; READ COMMITTED takes one per statement"

  - title: "PostgreSQL docs — Heap-Only Tuples (HOT)"
    url: https://www.postgresql.org/docs/current/storage-hot.html
    type: doc
    fetched: 2026-08-22
    read_as: "grounds §hot-or-not — the two conditions, chain to the new version, redirect after pruning, fillfactor, pg_stat counters"

  - title: "PostgreSQL docs — Progress Reporting (VACUUM phases)"
    url: https://www.postgresql.org/docs/current/progress-reporting.html
    type: doc
    fetched: 2026-08-23
    read_as: "grounds §afterlife step 4 — scan heap → vacuum indexes → vacuum heap, in that order"

  - title: "PostgreSQL docs — Visibility Map"
    url: https://www.postgresql.org/docs/current/storage-vm.html
    type: doc
    fetched: 2026-08-22
    read_as: "grounds §heap-fetches — all-visible bit set only by VACUUM, cleared by any page modification"

  - title: "PostgreSQL docs — ch. 11 Indexes"
    url: https://www.postgresql.org/docs/current/indexes.html
    type: doc
    fetched: 2026-08-22
    read_as: "grounds §heap-fetches — index-only scans and Heap Fetches semantics (11.9)"
